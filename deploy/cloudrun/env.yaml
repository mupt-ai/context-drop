# Server settings for Cloud Run; deploy.sh adds the secrets.
CONTEXT_DROP_ADDR: ":8080"
CONTEXT_DROP_BASE_URL: https://contextdrop.dev
CONTEXT_DROP_STORAGE: gcs
CONTEXT_DROP_GCS_BUCKET: context-drop-prod
CONTEXT_DROP_DEFAULT_TTL: 24h
CONTEXT_DROP_MAX_TTL: 168h
CONTEXT_DROP_MAX_BYTES: "26214400"
# Google's front end appends one hop; 2 while the old VM still forwards to Cloud Run.
CONTEXT_DROP_PROXY_HOPS: "2"
CONTEXT_DROP_DATA_DIR: /tmp/data
CONTEXT_DROP_MODS_DIR: /tmp/mods

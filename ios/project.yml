name: ContextDrop
options:
  bundleIdPrefix: com.avyay
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ContextDrop:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        DEVELOPMENT_TEAM: 6SMT972MY9
        PRODUCT_BUNDLE_IDENTIFIER: com.avyay.faceguard
        INFOPLIST_KEY_CFBundleDisplayName: Context Drop
        CURRENT_PROJECT_VERSION: 15
        MARKETING_VERSION: 0.6.0
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Context Drop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon60x60]
            UIPrerenderedIcon: false
        NSBluetoothAlwaysUsageDescription: Context Drop reads movement from your Oura ring to remind you when you touch your hair or face.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        UIBackgroundModes: [bluetooth-central]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
schemes:
  ContextDrop:
    build:
      targets:
        ContextDrop: all

name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - run: make coverage test
        working-directory: cli

      - name: Org server against Postgres
        run: go test -race -count=1 ./internal/orgserver ./internal/mods
        working-directory: cli
        env:
          CONTEXT_DROP_TEST_POSTGRES: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
